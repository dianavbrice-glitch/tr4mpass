name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libplist-dev libssl-dev

      - name: Build
        run: |
          make -j$(nproc)

      - name: Run unit tests
        run: |
          make test

      - name: Run mock/integration tests
        run: |
          make test-mocks
